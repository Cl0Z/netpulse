services:
  postgres:
    image: postgres:17
    container_name: netpulse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: netpulse
      POSTGRES_USER: netpulse
      POSTGRES_PASSWORD: change_this_password

    ports:
      - "5432:5432"

    volumes:
      - netpulse_postgres_data:/var/lib/postgresql/data

volumes:
  netpulse_postgres_data:
